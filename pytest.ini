[pytest]
addopts = --hypothesis-seed=0
# /app is root-owned inside the container image, so pytest's default
# .pytest_cache next to it cannot be created and every run ends in a
# wall of PermissionError warnings. logs/ is a bind mount owned by the
# user the container runs as, and is already git-ignored.
cache_dir = logs/.pytest_cache
testpaths = tests
markers =
    real_probe: use the genuine network reachability check instead of the stub
    preview_server: run the dashboard with a real MJPEG preview server
