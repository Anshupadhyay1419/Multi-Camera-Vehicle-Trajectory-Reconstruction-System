# Alembic configuration for the Sentinel platform.
#
#   cd sentinel_system
#   alembic revision --autogenerate -m "create cameras table"
#   alembic upgrade head
#
# The database URL is NOT written here. It is read from SENTINEL_DATABASE_URL
# by migrations/env.py, so the same config file works against a developer's
# SQLite file and a production PostgreSQL cluster without edits -- and so a
# production DSN never ends up committed to the repository.

[alembic]
script_location = migrations
prepend_sys_path = ..
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
