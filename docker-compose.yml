# ALPR University Gate — full system on one GPU PC.
#
#   ./docker/start.sh                first time on a fresh clone (does the setup)
#   docker compose up -d --build     build and start
#   docker compose logs -f alpr      follow the pipeline/dashboard log
#   docker compose down              stop
#
# Dashboard  http://<this-pc>:8502
# API        http://<this-pc>:8000/docs

x-alpr: &alpr
  image: alpr-university-gate:latest
  # Host networking: the container sees the campus LAN exactly as this PC
  # does, so rtsp://<camera-ip> works with no NAT or port mapping in between.
  network_mode: host
  # Files written to the mounted folders stay owned by you on the host, not
  # root. docker/start.sh writes your UID/GID into .env; 1000 is the usual
  # first Linux user if you start without it.
  user: "${UID:-1000}:${GID:-1000}"
  # PyTorch/OpenCV worker memory; Docker's 64 MB default crashes them.
  shm_size: 2gb
  restart: unless-stopped
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility, video]
  volumes:
    - ./models:/app/models      # weights + TensorRT engines (rebuilt here if mismatched)
    - ./config:/app/config      # config.yaml, cameras, blacklist -- edits persist
    - ./data:/app/data          # database, uploads, plate/vehicle crops, previews
    - ./logs:/app/logs

    # ── the checkout itself ────────────────────────────────────────────
    # The image carries its own copy of the code (Dockerfile: COPY . /app)
    # so it can run on a machine that has no checkout. Here the checkout is
    # mounted over it, and the checkout wins.
    #
    # This is what ends the failure that kept costing a whole session: edit
    # a file, start the stack, and watch the container keep running whatever
    # code was baked in the last time somebody remembered `--build`. Nothing
    # is stale any more, because nothing is copied -- `./run restart` picks
    # up an edit, and only a change to requirements.txt still needs a build.
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./main.py:/app/main.py
    # Sentinel platform (Gujarat Police). A separate top-level package from
    # src/: it shares this checkout and this interpreter, but none of the
    # ALPR pipeline's models or imports.
    - ./sentinel_system:/app/sentinel_system

    # Test fixtures .dockerignore deliberately drops to keep the image small
    # (*.mp4 is 38 MB, training/ is not needed to run). Without them nine
    # tests fail inside the container for want of files that were never
    # copied in -- which reads as "the project is broken" rather than "the
    # image is on a diet". Mounted, so `./run test` means what it says.
    - ./tests:/app/tests
    - ./conftest.py:/app/conftest.py
    - ./pytest.ini:/app/pytest.ini
    - ./training:/app/training
    - ./ALPR.mp4:/app/ALPR.mp4
    - ./mycarplate.mp4:/app/mycarplate.mp4

services:
  # Dashboard + camera manager + ALPR pipeline. They share one process by
  # design: models load once and every live camera thread uses them.
  alpr:
    <<: *alpr
    build: .
    container_name: alpr-dashboard
    environment:
      # Open the dashboard and processing is already running -- the live
      # feeds play without pressing START. Once per container start; STOP
      # PROCESSING stops it until START is pressed. Set to 0 to disable.
      # Deliberately on this service only: the API must never start a
      # session by itself, or two pipelines would fight over the GPU.
      - ALPR_AUTOSTART=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # REST API for other systems (security office, police software, etc.).
  api:
    <<: *alpr
    container_name: alpr-api
    # Same image as the dashboard; never try to pull it from a registry.
    pull_policy: never
    depends_on: [alpr]
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
