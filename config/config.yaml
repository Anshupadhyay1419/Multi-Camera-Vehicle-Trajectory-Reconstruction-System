# ── Camera identity / siting ────────────────────────────────────────────────
# Who and where this unit is. One Jetson watches one gate, so these are
# static per-device facts, not per-frame data -- they get stamped onto every
# event this device stores so the dashboard can show *which* gate a plate was
# seen at, not just when.
#
# Set these per unit when provisioning a new Jetson:
#   camera_id    short stable code, unique across the deployment. This is the
#                value the dashboard groups and filters by, so don't reuse or
#                renumber it after events have been stored against it.
#   camera_name  human-readable label shown in the dashboard UI.
#   latitude /   decimal degrees, WGS84 -- the format a phone's map app shows
#   longitude    (e.g. 28.613939, 77.209023), NOT degrees/minutes/seconds.
#                Leave both null until the gate is actually surveyed; the
#                dashboard then just shows the name with no coordinates,
#                which is honest. A wrong-but-plausible pair is worse than
#                none, since it plots the gate somewhere it isn't.
#
# Existing events (stored before this block existed) keep NULL camera fields
# and render as "--" -- only newly stored events carry this metadata. If the
# whole block is missing, the pipeline falls back to an obvious "UNKNOWN"
# placeholder rather than inventing a plausible one.
camera:
  camera_id: "GATE-01"
  camera_name: "Main Gate"
  latitude: null
  longitude: null

video:
  source: "mycarplate.mp4"              # local video file, or rtsp://... / 0 (webcam) for live
  # frame_skip=2 was needed when OCR preprocessing/inference were slow
  # (NLM denoise + per-call CUDA alloc). Both are now ~1-6ms, so the real
  # cost per frame is detection, not OCR — and skipping frames doubles the
  # inter-frame box motion ByteTrack has to match, which was fragmenting a
  # single vehicle into multiple track IDs (each restarting fusion voting
  # from zero, so plates went unstored). Process every frame instead.
  # Only applies to local video files -- a live source (rtsp://, webcam
  # index, http(s)://) always runs through a background reader thread that
  # keeps only the newest frame, which supersedes frame-skipping.
  frame_skip: 1
  # Play a recorded file at the speed it was actually shot.
  #
  # Nothing else paces a file: it is read as fast as the hardware can
  # process it, so on a machine faster than the footage the camera wall
  # shows the clip sped up (about 2x for a 30fps clip here). Detections are
  # unaffected either way -- this is about the picture being honest, and
  # about a preview you can actually watch a vehicle in.
  #
  # Set to false to process recorded files as fast as possible, which
  # finishes a long queue of clips sooner at the cost of unwatchable
  # previews. Ignored for live sources, which the camera already paces.
  realtime_playback: true
  max_retries: 5                           # reconnect attempts on failure
  # Live sources only: how long read_frame() waits for a new frame before
  # treating the connection as stalled and forcing a reconnect. Guards
  # against a network fault that hangs the read instead of failing it.
  stall_timeout: 10.0

detection:
  # ── Compute device ──────────────────────────────────────────────────────
  # Resolved ONCE per process by src/runtime/device.py and then handed to
  # every model, so detection and OCR can never disagree about the hardware.
  #
  #   0 / "cuda:0"  a specific GPU. If it is not there, startup FAILS rather
  #                 than falling back -- an explicit GPU that quietly becomes
  #                 the CPU is a ~58x slowdown nobody notices.
  #   "auto"        use a GPU when one is really present, else the CPU. Logs
  #                 a WARNING when it degrades. Use this for a build that
  #                 ships to machines with and without a GPU.
  #   "cpu"         force the CPU. The OCR backend below is then switched to
  #                 a CPU one automatically, because a CPU process cannot
  #                 host a TensorRT engine.
  #
  # half: fp16 inference — ~2x faster on GPU, negligible accuracy hit. It is
  # a request, not a command: it is forced off on the CPU, where fp16 is
  # emulated and slower than fp32.
  #
  # Both are ignored automatically when a model_path points at a pre-exported
  # .engine/.onnx plan (those already fix precision/device at export time).
  # Point *_model_path at a .engine file (run scripts/export_detectors_trt.sh
  # once on-device) for the biggest latency win — raw .pt inference through
  # PyTorch/ultralytics is 3-5x slower than TensorRT on this hardware.
  device: 0
  half: true
  vehicle_model_path: "yolov8s.pt"
  vehicle_confidence: 0.5                  # Back to conservative (0.4 catches too many false positives)
  vehicle_imgsz: 480                       # full-frame detection; 480 balances speed/recall
  plate_model_path: "models/plate_detector/best.pt"
  plate_confidence: 0.4                    # Back to conservative
  plate_imgsz: 320                         # plate search is within an already-localized vehicle crop

tracking:
  # In PROCESSED frames, not video frames. frame_skip went from 2 to 1
  # above, doubling the processing rate — so this had to double too, or a
  # track now gets dropped (and a re-detected vehicle gets a brand new ID)
  # after half the real-world time it used to tolerate.
  lost_track_timeout: 60                   # frames before track is retired
  # ByteTrack matches a detection to a track when the association COST
  # (1 - IOU) is at or below this value — so this is a cost ceiling, NOT a
  # minimum IOU. 0.8 (the ByteTrack/supervision default) accepts any pair
  # overlapping by IOU >= 0.2; 0.5 demands IOU >= 0.5, which is far stricter
  # and splits a fast-moving or partially-occluded vehicle into new track IDs
  # mid-pass. This was set to 0.5 believing it was the permissive direction;
  # measured on the gate video (4 vehicles), 0.5 produced 24 track IDs and
  # 0.8 produces 6. Lower this only to make tracking stricter.
  minimum_matching_threshold: 0.8
  # Live sources only (ignored for a video file — see frame_capture.py: a
  # file has no real-time pressure, so every track gets serviced every
  # frame regardless of this setting). Caps how many tracks get the full
  # plate-detect + preprocess + SR + OCR chain on any one processed frame;
  # the rest rotate in on later frames. On-device benchmarking showed that
  # chain scales linearly with simultaneously-visible vehicles (~38ms/frame
  # at 1, ~98ms/frame at 4, against a ~33ms budget at 30fps) even though
  # each model call alone is fast (plate detect ~13ms, OCR ~4ms) — once a
  # frame overruns the camera's own interval, frame_capture.py's live path
  # correctly drops frames to avoid unbounded latency, but a moving
  # vehicle's box then jumps far enough between processed frames to break
  # ByteTrack's IOU match, fragmenting the track and resetting OCR fusion's
  # vote count right as the vehicle passes. Raise this only after
  # confirming (e.g. via `--benchmark`) that your camera's typical
  # simultaneous-vehicle count still fits your frame budget at the higher
  # value.
  live_max_heavy_tracks_per_frame: 1

preprocessing:
  clahe_clip_limit: 2.0                    # Balanced for speed
  clahe_tile_size: 8
  denoise_h: 10
  sharpen_strength: 1.5
  # Auto gamma-correct each crop toward mid-gray (brightens night/
  # underexposed plates, recovers detail from glare/overexposed ones) and
  # scale CLAHE's clip limit to the crop's own contrast. Needed for a live
  # feed with real day/night/glare variance; a recorded, evenly-lit video
  # won't visibly change since well-exposed crops are left alone.
  adaptive_lighting: true

enhancement:
  # sr_threshold_px: plates narrower than this (px) get upscaled before OCR.
  # On Jetson 7.2: Real-ESRGAN is unavailable (no PyTorch wheel yet) so
  # OpenCV INTER_CUBIC upscale is used automatically — still helpful.
  # Set to 0 to disable upscaling entirely.
  sr_threshold_px: 180
  realesrgan_model_path: "models/realesrgan/RealESRGAN_x4plus.pth"

ocr:
  # ── Backend selection ─────────────────────────────────────────────────────
  # Choose OCR backend. For GPU TensorRT experiments set to `parseq_tensorrt`.
  # RapidOCR is the more reliable CPU backend for this video pipeline.
  # PARSeq TensorRT is available for GPU inference/experiments.
  backend: "parseq_tensorrt"

  # ── RapidOCR (Phase 1 — active) ───────────────────────────────────────────
  # Runs PP-OCRv3/v4 ONNX models via onnxruntime (CPU on JetPack 7.2).
  # No PaddlePaddle dependency. ~80–120ms/crop on Jetson Orin Nano CPU.
  # OCRFusion window of 5 frames compensates for the slower per-frame latency.
  rapidocr:
    text_score: 0.5       # minimum confidence per text region (0.4–0.6)
    use_det: true         # text region detection inside crop (recommended)
    use_cls: true         # angle classifier — handles rotated/upside-down plates
    use_rec: true         # recognition (always true)

  # ── TensorRT PARSeq ──────────────────────────────────────────────────────
  # GPU inference. The wrapper chooses TensorRT 10's named-tensor API or
  # TensorRT 8's binding API automatically and rebuilds a mismatched plan.
  parseq:
    # Official baudm/parseq-tiny model (not the legacy custom CNN).
    engine_path: "models/ocr/parseq_official_tiny.engine"
    onnx_path: "models/ocr/parseq_official_tiny.onnx"
    input_size: [32, 128]     # H x W — must match trtexec --optShapes
    charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    decoder_mode: "official_parseq_94"
    batch_size: 1

  # ── Other backends (x86 dev / fallback) ──────────────────────────────────
  paddleocr:
    use_angle_cls: true
    lang: "en"
  easyocr:
    lang: ["en"]
    gpu: true
    allowlist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  trocr:
    model_name: "microsoft/trocr-base-printed"
  ensemble:
    backends: ["rapidocr"]
    min_vote_count: 1
    use_variants: true
  confidence_threshold: 0.70                # reject reads below this confidence

fusion:
  window_size: 5                           # majority vote over 5 reads for accuracy
  min_confidence: 0.55                     # minimum confidence threshold
  # Was 3 when using the un-fine-tuned PARSeq model (noisy per-frame reads,
  # needed extra repeats to trust a plate). The fine-tuned model now reads
  # at 0.95-1.00 confidence consistently, so 3 identical votes is often
  # more than a short-lived, fragmented track (2-3 frames) ever gets --
  # which silently drops an otherwise-correct plate. 2 is enough given the
  # model's now much lower per-frame error rate.
  min_exact_votes: 2

deduplication:
  window_seconds: 30
  # Two plate strings within this Levenshtein distance count as the same
  # plate. Catches a fragmented track re-reading the same physical vehicle
  # with one or two OCR-confused characters (O/C, O/0, L/D, C/7, ...)
  # instead of storing it as a second, wrong event. Was 1; raised to 2
  # after a real fragment misread 2 characters at once (DL7CD5017 read as
  # DD77D5017 by a short-lived track). Tradeoff: two DIFFERENT vehicles
  # that both pass within window_seconds AND happen to have plates within
  # edit distance 2 (e.g. sequential fleet/batch registrations) would also
  # get merged. Acceptable for a lower-traffic gate; revisit if that
  # becomes a real collision case.
  max_edit_distance: 2

# Vehicle BODY colour for vehicle profiles (classification/vehicle_color.py).
# Not to be confused with color_classifier below, which reads the PLATE.
# Every key is optional; these are the defaults. OpenCV HSV: H 0-179, S/V 0-255.
vehicle_color:
  region_top: 0.35       # skip the top of the box: windscreen and roof reflect sky
  min_saturation: 55     # a pixel carries hue above this saturation...
  min_value: 50          # ...and this brightness
  chromatic_share: 0.25  # share of such pixels for a vehicle to count as coloured
  white_min_value: 180   # achromatic vehicles by typical brightness:
  silver_min_value: 130  #   >=180 White, >=130 Silver, >=70 Gray, else Black
  # That brightness is read from BODYWORK only. A row of the crop counts as
  # bodywork if it is one colour all the way across (quartile spread within
  # this), which excludes glass -- full of reflections -- and trim rows that
  # are half dark paint and half chrome. Without it a tall vehicle whose
  # rear window falls inside the sampled band is judged mostly on its glass:
  # a white van read 179 against the 180 it needed and was called Silver.
  # Raise it to accept patchier rows as bodywork, 0 to use every row.
  panel_row_spread_max: 60
  gray_min_value: 70
  brightness_percentile: 50  # typical panel brightness (upper percentiles follow chrome/glare)
  brown_max_value: 150   # dark orange below this brightness is Brown

color_classifier:
  hsv_ranges:
    White: [[0, 180], [0, 30], [200, 255]]
    Yellow: [[20, 35], [100, 255], [100, 255]]
    Green: [[40, 80], [50, 255], [50, 255]]
    Red: [[0, 10], [100, 255], [100, 255]]
    Red2: [[160, 180], [100, 255], [100, 255]]
    Blue: [[100, 130], [100, 255], [100, 255]]
    Black: [[0, 180], [0, 255], [0, 50]]
    Army_Green: [[35, 75], [30, 120], [30, 120]]

direction:
  virtual_line: {x1: 0, y1: 360, x2: 1280, y2: 360}
  dual_camera: false

motion_filter:
  # On Jetson with OpenCV upscale (no Real-ESRGAN), the pipeline is faster
  # per frame, so displacement per frame is slightly higher than with SR.
  min_displacement_px: 3.0
  history_frames: 3
  # Set to false when testing against a stationary target (e.g. a video
  # played on a phone/laptop screen held up to the camera) -- a real
  # vehicle's spatial displacement never happens there, so this filter
  # would otherwise silently block plate detection/OCR for it entirely.
  # Set back to true for real deployment (ignores parked/stationary vehicles).
  enabled: false

database:
  path: "data/alpr.db"
  image_save_path: "data/plate_crops/"
  # Whole-vehicle crops, kept apart from the plate crops above: the two have
  # different sizes and lifetimes, and the API mounts only the plate-crop
  # directory as a static route. Written only by the multi-camera pipeline
  # (the single-gate path stores no vehicle image), and shown in map popups
  # and on the trajectory search page -- a plate crop alone is not
  # recognisable as a vehicle.
  vehicle_image_save_path: "data/vehicle_crops/"
  # Vehicle profile thumbnails (vehicles/ and plates/ underneath): small JPEGs
  # for dashboard cards, alongside the full-size crops above.
  thumbnail_dir: "data/thumbnails"

api:
  host: "0.0.0.0"
  port: 8000
  # Live camera feed (dashboard's /stream, /snapshot). The pipeline writes
  # the current annotated frame here at up to live_frame_fps; the API just
  # reads and serves whatever's currently on disk.
  live_stream_enabled: true
  live_frame_path: "data/live_frame.jpg"
  # Multi-camera runs publish ONE annotated frame per camera in here
  # (<camera_id>.jpg), which is what the dashboard's camera wall shows.
  # Cameras run one at a time, so a single shared file would leave three of
  # the four panels showing the active camera's video under someone else's
  # label.
  live_frames_dir: "data/live_frames"
  live_frame_fps: 8.0
  # Camera-wall previews (multi-camera runs). Published faster and smaller
  # than the single-gate feed above because the dashboard plays them as
  # continuous video rather than refreshing a still image. Note a recorded
  # video's preview can never be smoother than the pipeline processes it.
  live_frames_fps: 15.0
  live_frames_max_width: 960
  # The dashboard serves those previews as MJPEG streams on this port, so the
  # browser can play them without re-running the Streamlit page. The browser
  # must be able to reach it -- open it in the firewall alongside 8501.
  preview_host: "0.0.0.0"
  preview_port: 8765

dashboard:
  enabled: true
  refresh_interval_seconds: 3

# ── Multi-camera trajectory reconstruction ──────────────────────────────────
# The camera network itself (ids, names, coordinates, video/RTSP sources) is
# declared in a file of its own, config/camera_config.yaml, because it is
# per-deployment data that grows with the number of sites -- while this file
# is per-device tuning. The `camera:` block at the top of THIS file still
# describes the single-gate pipeline and is unchanged; it is what
# scripts/run_pipeline.py uses when run on its own.
multi_camera:
  config_path: "config/camera_config.yaml"

logging:
  log_file: "logs/alpr.log"
  max_bytes: 10485760
  backup_count: 5

training:
  pretrained_weights: "yolov8m.pt"
  epochs: 100
  image_size: 640
  batch_size: 8        # RTX 3050 4GB VRAM — safe batch size
  workers: 4           # data loader workers
  device: "0"          # GPU 0 (CUDA)
  cache: false         # set true if you have 16GB+ RAM to cache dataset
  amp: true            # mixed precision — faster on RTX 30xx, saves VRAM
  compute_flops: true  # compute GFLOPs during evaluation
  test_split_count: 300
  augmentation:
    brightness_range: [-0.2, 0.2]
    contrast_range: [0.8, 1.2]
    blur_kernel_max: 5
    blur_probability: 0.3
    noise_std_range: [5, 25]
    fog_intensity: 0.3
    fog_probability: 0.2
    rotation_degrees: 10
