video:
  source: "ALPR.mp4"              # local video file
  frame_skip: 2                            # Process every 2nd frame for SPEED (complete coverage with performance)
  max_retries: 5                           # reconnect attempts on failure

detection:
  vehicle_model_path: "models/vehicle_detector/yolov8n.pt"
  vehicle_confidence: 0.5                  # Back to conservative (0.4 catches too many false positives)
  plate_model_path: "models/plate_detector/best.pt"
  plate_confidence: 0.4                    # Back to conservative

tracking:
  lost_track_timeout: 30                   # frames before track is retired

preprocessing:
  clahe_clip_limit: 2.0                    # Balanced for speed
  clahe_tile_size: 8
  denoise_h: 10
  sharpen_strength: 1.5

enhancement:
  # sr_threshold_px: plates narrower than this (px) get upscaled before OCR.
  # On Jetson 7.2: Real-ESRGAN is unavailable (no PyTorch wheel yet) so
  # OpenCV INTER_CUBIC upscale is used automatically — still helpful.
  # Set to 0 to disable upscaling entirely.
  sr_threshold_px: 180
  realesrgan_model_path: "models/realesrgan/RealESRGAN_x4plus.pth"

ocr:
  # ── Backend selection ─────────────────────────────────────────────────────
  # JetPack 7.2  Phase 1 (current):  "rapidocr"  — PP-OCR via onnxruntime CPU
  # JetPack 7.2  Phase 2 (PARSeq fine-tuned): switch to "tensorrt"
  # x86 dev:                          "rapidocr" or "paddleocr"
  backend: "rapidocr"

  # ── RapidOCR (Phase 1 — active) ───────────────────────────────────────────
  # Runs PP-OCRv3/v4 ONNX models via onnxruntime (CPU on JetPack 7.2).
  # No PaddlePaddle dependency. ~80–120ms/crop on Jetson Orin Nano CPU.
  # OCRFusion window of 5 frames compensates for the slower per-frame latency.
  rapidocr:
    text_score: 0.5       # minimum confidence per text region (0.4–0.6)
    use_det: true         # text region detection inside crop (recommended)
    use_cls: true         # angle classifier — handles rotated/upside-down plates
    use_rec: true         # recognition (always true)

  # ── TensorRT PARSeq (Phase 2 — activate after fine-tuning) ───────────────
  # GPU inference via TensorRT 10.16 (pre-installed with JetPack 7.2).
  # ~5ms/crop. Switch backend to "tensorrt" after building the .engine file.
  # Full build instructions: src/ocr/tensorrt_engine.py
  tensorrt:
    engine_path: "models/ocr/parseq_plate.engine"
    input_size: [32, 128]     # H x W — must match trtexec --optShapes
    charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"

  # ── Other backends (x86 dev / fallback) ──────────────────────────────────
  paddleocr:
    use_angle_cls: true
    lang: "en"
  easyocr:
    lang: ["en"]
    gpu: true
    allowlist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  trocr:
    model_name: "microsoft/trocr-base-printed"
  ensemble:
    backends: ["rapidocr"]
    min_vote_count: 1
    use_variants: true
  confidence_threshold: 0.70                # reject reads below this confidence

fusion:
  window_size: 5                           # majority vote over 5 reads for accuracy
  min_confidence: 0.55                     # minimum confidence threshold

deduplication:
  window_seconds: 30

color_classifier:
  hsv_ranges:
    White: [[0, 180], [0, 30], [200, 255]]
    Yellow: [[20, 35], [100, 255], [100, 255]]
    Green: [[40, 80], [50, 255], [50, 255]]
    Red: [[0, 10], [100, 255], [100, 255]]
    Red2: [[160, 180], [100, 255], [100, 255]]
    Blue: [[100, 130], [100, 255], [100, 255]]
    Black: [[0, 180], [0, 255], [0, 50]]
    Army_Green: [[35, 75], [30, 120], [30, 120]]

direction:
  virtual_line: {x1: 0, y1: 360, x2: 1280, y2: 360}
  dual_camera: false

motion_filter:
  # On Jetson with OpenCV upscale (no Real-ESRGAN), the pipeline is faster
  # per frame, so displacement per frame is slightly higher than with SR.
  min_displacement_px: 3.0
  history_frames: 3

database:
  path: "data/alpr.db"
  image_save_path: "data/plate_crops/"

api:
  host: "0.0.0.0"
  port: 8000

dashboard:
  enabled: true
  refresh_interval_seconds: 3

logging:
  log_file: "logs/alpr.log"
  max_bytes: 10485760
  backup_count: 5

training:
  pretrained_weights: "yolov8m.pt"
  epochs: 100
  image_size: 640
  batch_size: 8        # RTX 3050 4GB VRAM — safe batch size
  workers: 4           # data loader workers
  device: "0"          # GPU 0 (CUDA)
  cache: false         # set true if you have 16GB+ RAM to cache dataset
  amp: true            # mixed precision — faster on RTX 30xx, saves VRAM
  compute_flops: true  # compute GFLOPs during evaluation
  test_split_count: 300
  augmentation:
    brightness_range: [-0.2, 0.2]
    contrast_range: [0.8, 1.2]
    blur_kernel_max: 5
    blur_probability: 0.3
    noise_std_range: [5, 25]
    fog_intensity: 0.3
    fog_probability: 0.2
    rotation_degrees: 10
